<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Deep background ambient glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#141624" />
      <stop offset="100%" stop-color="#08090f" />
    </radialGradient>

    <!-- Camera Outer Frame Vibrant Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5af1" />
      <stop offset="25%" stop-color="#22b2f6" />
      <stop offset="45%" stop-color="#8038f5" />
      <stop offset="70%" stop-color="#ea4492" />
      <stop offset="90%" stop-color="#ff933b" />
      <stop offset="100%" stop-color="#ffc83b" />
    </linearGradient>

    <!-- Sun / Moon Warm Gradient -->
    <linearGradient id="sunGrad" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#f8a5c2" />
      <stop offset="40%" stop-color="#fbc531" />
      <stop offset="100%" stop-color="#fdf499" />
    </linearGradient>

    <!-- Left Foreground Mountain Bright Gradient -->
    <linearGradient id="leftPeakGrad" x1="15%" y1="100%" x2="70%" y2="20%">
      <stop offset="0%" stop-color="#4a69bd" />
      <stop offset="45%" stop-color="#1e90ff" />
      <stop offset="100%" stop-color="#70a1ff" />
    </linearGradient>

    <!-- Right Background Mountain Deep Gradient -->
    <linearGradient id="rightPeakGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#2f3542" />
      <stop offset="35%" stop-color="#3742fa" />
      <stop offset="100%" stop-color="#833471" />
    </linearGradient>

    <!-- Star Glow / Radiance Gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff5cc" />
      <stop offset="65%" stop-color="#fbc531" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbc531" stop-opacity="0" />
    </radialGradient>

    <!-- Star Solid Core Gradient -->
    <linearGradient id="starCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fff2a1" />
      <stop offset="100%" stop-color="#f9ca24" />
    </linearGradient>

    <!-- Soft Blur Filter for realistic lighting/blooms -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" />
    </filter>

    <!-- Star Bloom Filter -->
    <filter id="starBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGlow)" />

  <!-- LOGO ICON GROUP (Centered and Scaled up) -->
  <g transform="translate(400, 400) scale(1.4) translate(-547, -387)">

    <!-- Background Shadow Mask Behind Mountain Area -->
    <path d="M 326 534 Q 442 422 444 420 Q 456 408 468 420 L 594 544 L 690 490 Q 700 484 708 492 L 734 518 C 734 540 710 574 656 574 L 350 574 Z"
          fill="#0c0e17" opacity="0.6" />

    <!-- 1. Right / Back Mountain Peak -->
    <path d="M 510 470 
             L 570 424 
             C 580 416 594 416 604 424 
             L 688 494 
             C 696 500 690 514 680 514 
             L 480 514 Z" 
          fill="url(#rightPeakGrad)" />

    <!-- Back Mountain Soft Blend Falloff -->
    <path d="M 570 424 
             C 580 416 594 416 604 424 
             L 670 478 
             C 684 490 692 506 690 524 
             C 684 554 650 576 610 576 
             L 490 576 
             L 570 424 Z" 
          fill="url(#rightPeakGrad)" />

    <!-- 2. Left / Foreground Mountain Peak -->
    <path d="M 326 536 
             L 436 430 
             C 445 421 460 421 469 430 
             L 634 576 
             C 610 576 348 576 326 536 Z" 
          fill="url(#leftPeakGrad)" />

    <!-- Mountain Highlight Surface Overlay -->
    <path d="M 330 538 L 444 428 C 452 420 464 424 470 432 L 536 576 L 350 576 Z" 
          fill="#38b6ff" opacity="0.3" filter="url(#softGlow)" />

    <!-- 3. Glowing Sun / Inner Circle -->
    <circle cx="452" cy="358" r="49" fill="url(#sunGrad)" />
    <!-- Ambient Sun Glow -->
    <circle cx="452" cy="358" r="49" fill="orange" opacity="0.15" filter="url(#softGlow)" />

    <!-- 4. Camera Body Frame Structure (Vibrant Ribbon) -->
    <path d="
      M 406 234 
      L 432 234 
      C 442 234 451 228 456 219 
      L 462 208 
      C 472 190 491 179 512 179 
      L 588 179 
      C 612 179 632 198 632 222 
      L 632 266 
      C 632 278 622 288 610 288 
      L 456 288 
      C 440 288 424 294 412 306 
      C 400 318 394 334 394 350 
      L 394 518 
      C 394 532 406 544 420 544 
      L 620 544 
      C 658 544 688 514 688 476 
      L 688 386 
      C 688 372 700 360 714 360 
      C 728 360 740 372 740 386 
      L 740 476 
      C 740 542 686 596 620 596 
      L 420 596 
      C 376 596 342 562 342 518 
      L 342 350 
      C 342 318 355 290 376 269 
      C 385 260 395 253 406 248 
      Z" 
      fill="url(#frameGrad)" />

    <!-- Subtle Rounded Volumetric Accent on Top-Left Frame -->
    <path d="
      M 436 181 
      C 416 181 398 189 384 203 
      C 362 225 342 258 342 300 
      L 342 420 
      C 342 420 300 330 380 230 
      C 410 190 450 181 480 181 
      Z" 
      fill="url(#frameGrad)" opacity="0.3" />

    <!-- 5. 4-Point Magic Sparkle / Star Elements -->
    <!-- Broad background bloom behind the star -->
    <circle cx="680" cy="318" r="80" fill="url(#starGlow)" />

    <!-- Sharp, high-contrast 4-point Star -->
    <path d="
      M 680 236 
      Q 680 302 752 318 
      Q 680 334 680 400 
      Q 680 334 608 318 
      Q 680 302 680 236 Z" 
      fill="url(#starCoreGrad)" 
      filter="url(#starBloom)" />

    <!-- Micro-flare center point in Star -->
    <circle cx="680" cy="318" r="8" fill="#ffffff" />
  </g>

</svg>
